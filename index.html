<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>דשבורד מעקב החזרים</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Segoe UI", Arial, sans-serif; background: #f0f2f5; color: #1c1e21; direction: rtl; }
  header { background: #1f3a5f; color: #fff; padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
  header h1 { font-size: 1.3rem; font-weight: 600; }
  header .actions { display: flex; gap: 8px; }
  button { cursor: pointer; border: none; border-radius: 6px; padding: 8px 14px; font-size: 0.9rem; font-family: inherit; }
  .btn-light { background: #fff; color: #1f3a5f; }
  .btn-primary { background: #1f3a5f; color: #fff; }
  main { max-width: none; margin: 0; padding: 20px 24px 60px; }
  @media (max-width: 800px) { main { padding: 16px 12px 60px; } }
  #setup { max-width: 520px; margin: 80px auto; background: #fff; border-radius: 10px; padding: 28px; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
  #setup h2 { font-size: 1.1rem; margin-bottom: 12px; }
  #setup p { font-size: 0.9rem; color: #555; margin-bottom: 14px; line-height: 1.5; }
  #setup input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 0.95rem; margin-bottom: 12px; direction: ltr; text-align: left; }
  #error { display: none; background: #fdecea; border: 1px solid #f5c6c0; color: #a12622; border-radius: 8px; padding: 14px 16px; margin-bottom: 18px; font-size: 0.92rem; line-height: 1.6; }
  #note { display: none; background: #eef4fb; border: 1px solid #cfdef0; color: #2c4a73; border-radius: 8px; padding: 12px 16px; margin-bottom: 18px; font-size: 0.85rem; line-height: 1.6; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-bottom: 20px; }
  .card { background: #fff; border-radius: 10px; padding: 16px; box-shadow: 0 1px 4px rgba(0,0,0,.07); border-top: 4px solid #999; cursor: pointer; transition: box-shadow .12s; }
  .card:hover { box-shadow: 0 3px 10px rgba(0,0,0,.16); }
  .card.active { outline: 3px solid #1f3a5f; outline-offset: -1px; }
  .card .label { font-size: 0.85rem; color: #666; margin-bottom: 6px; }
  .card .amount { font-size: 1.4rem; font-weight: 700; }
  .card .count { font-size: 0.8rem; color: #888; margin-top: 4px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 20px; }
  @media (max-width: 800px) { .grid2 { grid-template-columns: 1fr; } }
  .panel { background: #fff; border-radius: 10px; padding: 18px; box-shadow: 0 1px 4px rgba(0,0,0,.07); }
  .panel h3 { font-size: 1rem; margin-bottom: 14px; color: #333; }
  .chart-wrap { position: relative; height: 280px; }
  .filters { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; align-items: center; }
  .filters select { padding: 7px 10px; border: 1px solid #ccc; border-radius: 6px; font-family: inherit; font-size: 0.9rem; background: #fff; }
  #activeFilter { display: none; background: #fff8e1; border: 1px solid #f0d98c; color: #6d5a00; border-radius: 8px; padding: 10px 14px; margin-bottom: 14px; font-size: 0.88rem; align-items: center; gap: 10px; flex-wrap: wrap; }
  #activeFilter.show { display: flex; }
  #activeFilter button { background: #6d5a00; color: #fff; padding: 4px 12px; font-size: 0.8rem; }
  table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
  th, td { padding: 9px 10px; text-align: right; border-bottom: 1px solid #eee; }
  th { background: #f7f8fa; font-weight: 600; position: sticky; top: 0; white-space: nowrap; }
  tbody tr:hover { background: #f7f9fc; }
  tbody tr.has-doc:hover { background: #eaf2fb; }
  tr.has-doc { cursor: pointer; }
  .table-wrap { overflow-x: auto; max-height: 560px; overflow-y: auto; }
  .chip { display: inline-block; padding: 3px 10px; border-radius: 12px; font-size: 0.78rem; font-weight: 600; color: #fff; white-space: nowrap; }
  .num { direction: ltr; unicode-bidi: embed; white-space: nowrap; }
  .notes { max-width: 260px; font-size: 0.8rem; color: #555; }
  .doc-yes { font-size: 1rem; text-decoration: none; }
  .doc-no { font-size: 0.75rem; color: #b0b0b0; white-space: nowrap; }
  .src { font-size: 0.78rem; color: #666; white-space: nowrap; }
  #updated { font-size: 0.8rem; color: #888; margin-bottom: 12px; }
  .hidden { display: none !important; }
  #loading { display: none; text-align: center; padding: 80px 0; color: #555; font-size: 0.95rem; }
  #dash.loading > *:not(#loading) { display: none; }
  #dash.loading #loading { display: block; }
  .spinner { width: 42px; height: 42px; margin: 0 auto 14px; border: 4px solid #d7dde5; border-top-color: #1f3a5f; border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<header>
  <h1>דשבורד מעקב החזרים</h1>
  <div class="actions">
    <button class="btn-light" id="refreshBtn" onclick="loadData(true)">רענון</button>
    <button class="btn-light" onclick="changeSheet()">שינוי קישור</button>
  </div>
</header>
<main>
  <div id="setup" class="hidden">
    <h2>חיבור לגיליון</h2>
    <p>הדביקו כאן קישור לגיליון Google עם נתוני ההחזרים. הגיליון חייב להיות משותף במצב "כל מי שיש לו את הקישור - צופה". הקישור נשמר בדפדפן זה בלבד.</p>
    <input id="sheetInput" type="text" placeholder="https://docs.google.com/spreadsheets/d/...">
    <button class="btn-primary" onclick="saveSheet()">שמירה וטעינה</button>
  </div>
  <div id="dash" class="hidden">
    <div id="loading"><div class="spinner"></div><p>טוען נתונים מהגיליון…</p></div>
    <div id="error"></div>
    <div id="note"></div>
    <div id="updated"></div>
    <div class="cards" id="cards"></div>
    <div class="grid2">
      <div class="panel"><h3>חלוקת סכומים לפי סטטוס</h3><div class="chart-wrap"><canvas id="statusChart"></canvas></div></div>
      <div class="panel"><h3>השוואה לפי ילד</h3><div class="chart-wrap"><canvas id="childChart"></canvas></div></div>
    </div>
    <div class="panel">
      <h3>כל הרשומות</h3>
      <div id="activeFilter"><span id="activeFilterText"></span><button onclick="clearCardFilter()">ניקוי סינון ✕</button></div>
      <div class="filters">
        <select id="fChild"><option value="">כל הילדים</option></select>
        <select id="fStatus"><option value="">כל הסטטוסים</option></select>
        <select id="fSource"><option value="">כל המקורות</option><option value="main">קבלות</option><option value="tform">טפסי T</option><option value="mushlam">מושלם</option></select>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr id="theadRow"></tr></thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </div>
  </div>
</main>

function getSheetId() {
  const v = localStorage.getItem(LS_KEY) || DEFAULT_SHEET;
  const m = v.match(/\/d\/([a-zA-Z0-9-_]+)/);
  return m ? m[1] : (v.match(/^[a-zA-Z0-9-_]{20,}$/) ? v : null);
}
function changeSheet() { document.getElementById('dash').classList.add('hidden'); document.getElementById('setup').classList.remove('hidden'); document.getElementById('sheetInput').value = localStorage.getItem(LS_KEY) || DEFAULT_SHEET; }
function saveSheet() {
  const v = document.getElementById('sheetInput').value.trim();
  if (!v) return;
  localStorage.setItem(LS_KEY, v);
  document.getElementById('setup').classList.add('hidden');
  document.getElementById('dash').classList.remove('hidden');
  loadData(true);
}
function statusColor(s) {
  if (!s) return '#888';
  if (s.includes('נדח')) return '#c0392b';
  if (s.includes('אושר')) return '#2e7d32';
  if (s.includes('טרם') || s.includes('ממתין') || s.includes('ממתינ') || s.includes('הוגש')) return '#e08e0b';
  if (s.includes('חלקי')) return '#7cb342';
  if (s.includes('זיכוי')) return '#1565c0';
  if (s.includes('ביטוח')) return '#607d8b';
  if (s.includes('התקבל')) return '#2e7d32';
  return '#888';
}
function fmt(n) { return (n || 0).toLocaleString('he-IL', {maximumFractionDigits: 0}) + ' ₪'; }
function pct(a, b) { return b ? (Math.round(a / b * 1000) / 10) + '%' : '0%'; }
function cellText(c) { if (!c) return ''; return (c.f != null ? String(c.f) : (c.v != null ? String(c.v) : '')); }
function cellNum(c) { if (!c || c.v == null) return 0; const n = typeof c.v === 'number' ? c.v : parseFloat(String(c.v).replace(/[^0-9.\-]/g, '')); return isNaN(n) ? 0 : n; }
function amtKey(n) { const r = Math.round((n || 0) * 100) / 100; return String(r); }
function pad2(n) { return String(n).padStart(2, '0'); }
function isoFromMailDate(s) { const d = new Date(s); return isNaN(d) ? (s || '') : d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
function isoFromILDate(s) { const m = (s || '').match(/(\d{2})\.(\d{2})\.(\d{4})/); return m ? m[3] + '-' + m[2] + '-' + m[1] : (s || ''); }

async function fetchTab(id, spec) {
  const tries = [];
  spec.names.forEach(n => tries.push('sheet=' + encodeURIComponent(n)));
  spec.gids.forEach(g => tries.push('gid=' + g));
  for (const t of tries) {
    try {
      const url = 'https://docs.google.com/spreadsheets/d/' + id + '/gviz/tq?tqx=out:json&headers=1&' + t + '&t=' + Date.now();
      const txt = await (await fetch(url)).text();
      const jsonStr = txt.substring(txt.indexOf('(', txt.indexOf('setResponse')) + 1, txt.lastIndexOf(')'));
      const data = JSON.parse(jsonStr);
      if (data.status !== 'ok') continue;
      // gviz silently returns the FIRST sheet when a sheet name does not match - validate by header label
      const labels = (data.table.cols || []).map(c => (c.label || '').trim());
      if (spec.expect && !labels.includes(spec.expect)) continue;
      return data.table;
    } catch (e) { /* try next */ }
  }
  return null;
}
function labelMap(cols) {
  const m = {};
  (cols || []).forEach((c, i) => { const l = (c.label || '').trim(); if (l && m[l] == null) m[l] = i; });
  return m;
}

async function loadData(force) {
  const id = getSheetId();
  const err = document.getElementById('error');
  const dash = document.getElementById('dash');
  err.style.display = 'none';
  if (!id) { changeSheet(); return; }
  dash.classList.add('loading');
  try {
    const mainTable = await fetchTab(id, TABS.main);
    if (!mainTable) throw new Error('main tab not found');
    buildMaps(mainTable.cols);
    rawRows = mainTable.rows.map(r => rowToObj(r.c)).filter(r => r.date || r.provider || r.amount);
    // refund-source tabs (best effort; dashboard still works without them)
    refundData.tforms = null; refundData.mushlam = null;
    const tfTable = await fetchTab(id, TABS.tforms);
    if (tfTable) refundData.tforms = parseTforms(tfTable);
    const muTable = await fetchTab(id, TABS.mushlam);
    if (muTable) refundData.mushlam = parseMushlam(muTable);
    buildAllRows();
    document.getElementById('updated').textContent = 'עודכן: ' + new Date().toLocaleString('he-IL') + ' | ' + allRows.length + ' רשומות';
    renderAll();
    dash.classList.remove('loading');
  } catch (e) {
    dash.classList.remove('loading');
    err.style.display = 'block';
    err.innerHTML = 'לא הצלחתי לטעון את הנתונים. בדקו שהקישור נכון ושהגיליון משותף במצב "כל מי שיש לו את הקישור - צופה".<br><span style="direction:ltr;unicode-bidi:embed;font-size:.8rem">' + String(e.message || e) + '</span>';
  }
}
function buildMaps(cols) {
  colMap = {};
  cols.forEach((c, i) => {
    const lbl = (c.label || '').trim();
    for (const k in HEADERS) if (lbl === HEADERS[k]) colMap[k] = i;
  });
}
function rowToObj(cells) {
  const o = {};
  for (const k in HEADERS) {
    const i = colMap[k];
    o[k] = i == null ? '' : cellText(cells[i]);
    o[k + 'Num'] = i == null ? 0 : cellNum(cells[i]);
  }
  return o;
}
function parseTforms(table) {
  const m = labelMap(table.cols);
  const iChild = m['ילד'], iClaimed = m['סכום שנתבע'], iApproved = m['סכום החזר שאושר'], iForm = m['מספר טופס'];
  const iMailDate = m['תאריך מייל'], iReceipts = m['מספרי קבלה'];
  const out = {forms: 0, claimed: 0, approved: 0, byChild: {}, rows: []};
  (table.rows || []).forEach(r => {
    const c = r.c || [];
    const form = iForm == null ? '' : cellText(c[iForm]).trim();
    const child = iChild == null ? '' : cellText(c[iChild]).trim();
    if (!form && !child) return; // skip empty/summary rows
    const claimed = iClaimed == null ? 0 : cellNum(c[iClaimed]);
    const approved = iApproved == null ? 0 : cellNum(c[iApproved]);
    out.forms++; out.claimed += claimed; out.approved += approved;
    const ch = child || 'לא צוין';
    out.byChild[ch] = out.byChild[ch] || {claimed: 0, approved: 0, forms: 0};
    out.byChild[ch].claimed += claimed; out.byChild[ch].approved += approved; out.byChild[ch].forms++;
    out.rows.push({src: 'tform', date: isoFromMailDate(iMailDate == null ? '' : cellText(c[iMailDate])),
      child: ch, provider: '', receipt: iReceipts == null ? '' : cellText(c[iReceipts]),
      amount: iClaimed == null ? '' : cellText(c[iClaimed]), amountNum: claimed,
      status: 'אושר', refund: iApproved == null ? '' : cellText(c[iApproved]), refundNum: approved,
      form: form, notes: '', evKey: 'T|' + form});
  });
  return out;
}
function parseMushlam(table) {
  const m = labelMap(table.cols);
  const iClaim = m['מספר תביעה'], iPart = m['חלק'], iStatus = m['סטטוס'], iDate = m['תאריך טיפול (תחילת חבילה)'];
  const iProv = m['מטפל'], iInv = m['סכום חשבונית'], iRefund = m['סכום החזר'];
  const out = {claims: 0, invoiced: 0, approved: 0, rejected: 0, pending: 0, rows: []};
  (table.rows || []).forEach(r => {
    const c = r.c || [];
    const claim = iClaim == null ? '' : cellText(c[iClaim]).trim();
    if (!claim) return; // skip totals/note rows at the bottom of the tab
    const part = iPart == null ? '' : cellText(c[iPart]).trim();
    const stFull = iStatus == null ? '' : cellText(c[iStatus]);
    const stParts = stFull.split('|');
    const st = stParts[0].trim();
    const inv = iInv == null ? 0 : cellNum(c[iInv]);
    const ref = iRefund == null ? 0 : cellNum(c[iRefund]);
    out.claims++; out.invoiced += inv;
    if (st.includes('נדח')) out.rejected += inv;
    else if (st.includes('אושר')) out.approved += ref;
    else out.pending += inv;
    out.rows.push({src: 'mushlam', date: isoFromILDate(iDate == null ? '' : cellText(c[iDate])),
      child: 'לאו', provider: iProv == null ? '' : cellText(c[iProv]), receipt: '',
      amount: iInv == null ? '' : cellText(c[iInv]), amountNum: inv,
      status: st, refund: iRefund == null ? '' : cellText(c[iRefund]), refundNum: ref,
      form: claim + (part ? ' חלק ' + part : ''), notes: stParts.length > 1 ? stParts.slice(1).join('|').trim() : '', evKey: null});
  });
  return out;
}
function buildAllRows() {
  allRows = rawRows.map(r => Object.assign({}, r, {src: 'main', evKey: r.date + '|' + amtKey(r.amountNum) + '|' + (r.child || '') + '|' + (r.receipt || '')}));
  if (refundData.tforms) allRows = allRows.concat(refundData.tforms.rows);
  if (refundData.mushlam) allRows = allRows.concat(refundData.mushlam.rows);
}
function cardClick(id) {
  activeCard = (activeCard === id) ? null : id;
  renderTable();
  document.querySelectorAll('.card').forEach(c => c.classList.toggle('active', c.dataset.cardId === activeCard));
  const bar = document.getElementById('activeFilter');
  if (activeCard && CARD_FILTERS[activeCard]) {
    bar.classList.add('show');
    document.getElementById('activeFilterText').textContent = 'מסנן פעיל: ' + CARD_FILTERS[activeCard].label;
  } else {
    bar.classList.remove('show');
  }
}
function clearCardFilter() {
  activeCard = null;
  document.querySelectorAll('.card').forEach(c => c.classList.remove('active'));
  document.getElementById('activeFilter').classList.remove('show');
  renderTable();
}
function renderAll() {
  const total = rawRows.reduce((s, r) => s + r.amountNum, 0);
  const mainRefundCol = rawRows.reduce((s, r) => s + r.refundNum, 0);
  const byStatus = {}, byChild = {};
  rawRows.forEach(r => {
    const st = r.status || 'ללא סטטוס';
    byStatus[st] = byStatus[st] || {count: 0, sum: 0, refund: 0};
    byStatus[st].count++; byStatus[st].sum += r.amountNum; byStatus[st].refund += r.refundNum;
    const ch = r.child || 'לא צוין';
    byChild[ch] = byChild[ch] || {count: 0, sum: 0, refund: 0};
    byChild[ch].count++; byChild[ch].sum += r.amountNum; byChild[ch].refund += r.refundNum;
  });
  // Refund actually received = approved T-forms + approved mushlam claims (per source tabs, not the partially filled main column)
  const tf = refundData.tforms, mu = refundData.mushlam;
  const tfApproved = tf ? tf.approved : 0;
  const muApproved = mu ? mu.approved : 0;
  const hasSources = !!(tf || mu);
  const refunded = hasSources ? tfApproved + muApproved : mainRefundCol;
  // per-child actual refunds
  const refundByChild = {};
  if (tf) Object.keys(tf.byChild).forEach(ch => {
    refundByChild[ch] = (refundByChild[ch] || 0) + tf.byChild[ch].approved;
  });
  if (mu) refundByChild['לאו'] = (refundByChild['לאו'] || 0) + mu.approved; // mushlam tab is Lau's claims
  if (!hasSources) Object.keys(byChild).forEach(ch => { refundByChild[ch] = byChild[ch].refund; });

  // card filter definitions (rebuilt each render)
  Object.keys(CARD_FILTERS).forEach(k => delete CARD_FILTERS[k]);
  CARD_FILTERS['total'] = {label: 'סכום קבלות כולל', fn: r => r.src === 'main'};
  CARD_FILTERS['refunded'] = {label: 'סה״כ הוחזר בפועל', fn: r => r.src === 'tform' || (r.src === 'mushlam' && (r.status || '').includes('אושר'))};
  if (tf) CARD_FILTERS['tforms'] = {label: 'טפסי החזר שאושרו (סל)', fn: r => r.src === 'tform'};
  if (mu) CARD_FILTERS['mushlam'] = {label: 'תביעות מושלם לאו', fn: r => r.src === 'mushlam'};
  Object.keys(byChild).sort().forEach(ch => {
    CARD_FILTERS['child:' + ch] = {label: 'רשומות של ' + ch, fn: r => (r.child || 'לא צוין') === ch};
  });
  Object.keys(byStatus).forEach(st => {
    CARD_FILTERS['status:' + st] = {label: 'סטטוס: ' + st, fn: r => r.src === 'main' && (r.status || 'ללא סטטוס') === st};
  });
  if (activeCard && !CARD_FILTERS[activeCard]) activeCard = null;

  let cards = '<div class="card" data-card-id="total" onclick="cardClick(\'total\')" style="border-top-color:#1f3a5f"><div class="label">סכום קבלות כולל</div><div class="amount">' + fmt(total) + '</div><div class="count">' + rawRows.length + ' רשומות</div></div>'
    + '<div class="card" data-card-id="refunded" onclick="cardClick(\'refunded\')" style="border-top-color:#2e7d32"><div class="label">סה״כ הוחזר בפועל</div><div class="amount">' + fmt(refunded) + '</div><div class="count">' + pct(refunded, total) + ' מהסכום הכולל</div></div>';
  if (tf) cards += '<div class="card" data-card-id="tforms" onclick="cardClick(\'tforms\')" style="border-top-color:#1565c0"><div class="label">טפסי החזר שאושרו (סל)</div><div class="amount">' + fmt(tfApproved) + '</div><div class="count">' + tf.forms + ' טפסים | נתבע ' + fmt(tf.claimed) + '</div></div>';
  if (mu) cards += '<div class="card" data-card-id="mushlam" onclick="cardClick(\'mushlam\')" style="border-top-color:#00695c"><div class="label">תביעות מושלם לאו</div><div class="amount">' + fmt(muApproved) + '</div><div class="count">' + mu.claims + ' חלקי תביעה' + (mu.rejected ? ' | נדחו ' + fmt(mu.rejected) : '') + (mu.pending ? ' | בתהליך ' + fmt(mu.pending) : '') + '</div></div>';
  Object.keys(byChild).sort().forEach(ch => {
    const spent = byChild[ch].sum, got = refundByChild[ch] || 0;
    cards += '<div class="card" data-card-id="child:' + esc(ch) + '" onclick="cardClick(\'child:' + esc(ch) + '\')" style="border-top-color:#6a1b9a"><div class="label">' + esc(ch) + ' - אחוז החזר</div><div class="amount">' + pct(got, spent) + '</div><div class="count">הוחזר ' + fmt(got) + ' מתוך ' + fmt(spent) + '</div></div>';
  });
  Object.keys(byStatus).sort((a, b) => byStatus[b].sum - byStatus[a].sum).forEach(st => {
    cards += '<div class="card" data-card-id="status:' + esc(st) + '" onclick="cardClick(\'status:' + esc(st) + '\')" style="border-top-color:' + statusColor(st) + '"><div class="label">' + esc(st) + '</div><div class="amount">' + fmt(byStatus[st].sum) + '</div><div class="count">' + byStatus[st].count + ' רשומות' + (byStatus[st].refund ? ' | הוחזר ' + fmt(byStatus[st].refund) : '') + '</div></div>';
  });
  document.getElementById('cards').innerHTML = cards;
  if (activeCard) {
    document.querySelectorAll('.card').forEach(c => c.classList.toggle('active', c.dataset.cardId === activeCard));
    const bar = document.getElementById('activeFilter');
    bar.classList.add('show');
    document.getElementById('activeFilterText').textContent = 'מסנן פעיל: ' + CARD_FILTERS[activeCard].label;
  } else {
    document.getElementById('activeFilter').classList.remove('show');
  }

  const note = document.getElementById('note');
  if (hasSources) {
    note.style.display = 'block';
    note.innerHTML = 'מקור נתוני ההחזר: לשוניות "טפסי החזר שאושרו" ו"תביעות מושלם לאו" (ולא עמודת "סכום החזר" בלשונית הראשית, שמולאה חלקית - ' + fmt(mainRefundCol) + ' בלבד). '
      + 'לשונית הזיכויים הרבעוניים אינה נספרת - אלו אותם כספים של טפסי ה-T בדיווח רבעוני של כללית (מניעת ספירה כפולה). '
      + 'לחיצה על כרטיס מסננת את הטבלה לרשומות שהוא מצרף; לחיצה על שורה פותחת את מסמך הראיה.';
  } else {
    note.style.display = 'block';
    note.innerHTML = 'שים לב: לא נמצאו לשוניות "טפסי החזר שאושרו"/"תביעות מושלם לאו" בגיליון - החישוב מסתמך על עמודת "סכום החזר" בלשונית הראשית בלבד, שמולאה חלקית.';
  }
  drawCharts(byStatus, byChild, refundByChild);
  fillFilters(byStatus, byChild);
  renderTable();
}
function drawCharts(byStatus, byChild, refundByChild) {
  Object.values(charts).forEach(c => c.destroy()); charts = {};
  const stKeys = Object.keys(byStatus);
  charts.status = new Chart(document.getElementById('statusChart'), {type: 'doughnut',
    data: {labels: stKeys, datasets: [{data: stKeys.map(k => byStatus[k].sum), backgroundColor: stKeys.map(statusColor)}]},
    options: {maintainAspectRatio: false, plugins: {legend: {position: 'bottom', rtl: true, textDirection: 'rtl', labels: {font: {size: 12}}}, tooltip: {rtl: true, textDirection: 'rtl', callbacks: {label: c => ' ' + c.label + ': ' + fmt(c.parsed)}}}}});
  const chKeys = Object.keys(byChild);
  charts.child = new Chart(document.getElementById('childChart'), {type: 'bar',
    data: {labels: chKeys, datasets: [
      {label: 'סכום קבלות', data: chKeys.map(k => byChild[k].sum), backgroundColor: '#1f3a5f'},
      {label: 'הוחזר בפועל', data: chKeys.map(k => refundByChild[k] || 0), backgroundColor: '#2e7d32'}]},
    options: {maintainAspectRatio: false, plugins: {legend: {position: 'bottom', rtl: true, textDirection: 'rtl'}, tooltip: {rtl: true, textDirection: 'rtl', callbacks: {label: c => ' ' + c.dataset.label + ': ' + fmt(c.parsed.y)}}}, scales: {y: {ticks: {callback: v => v.toLocaleString('he-IL')}, reverse: false}, x: {reverse: true}}}});
}
function fillFilters(byStatus, byChild) {
  const fs = document.getElementById('fStatus'), fc = document.getElementById('fChild');
  const sv = fs.value, cv = fc.value;
  fs.innerHTML = '<option value="">כל הסטטוסים</option>' + Object.keys(byStatus).sort().map(s => '<option>' + esc(s) + '</option>').join('');
  fc.innerHTML = '<option value="">כל הילדים</option>' + Object.keys(byChild).sort().map(s => '<option>' + esc(s) + '</option>').join('');
  fs.value = sv; fc.value = cv;
}
function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
function renderTable() {
  const fc = document.getElementById('fChild').value, fs = document.getElementById('fStatus').value, fsr = document.getElementById('fSource').value;
  const cf = activeCard && CARD_FILTERS[activeCard] ? CARD_FILTERS[activeCard].fn : null;
  const rows = allRows.filter(r =>
    (!fc || (r.child || 'לא צוין') === fc) &&
    (!fs || (r.status || 'ללא סטטוס') === fs) &&
    (!fsr || r.src === fsr) &&
    (!cf || cf(r)));
  rows.sort((a, b) => (b.date || '').localeCompare(a.date || ''));
  const cols = ['src','date','child','provider','receipt','amount','status','refund','form','notes','doc'];
  const colHeads = {src:'מקור', date:HEADERS.date, child:HEADERS.child, provider:HEADERS.provider, receipt:HEADERS.receipt, amount:HEADERS.amount, status:HEADERS.status, refund:HEADERS.refund, form:HEADERS.form, notes:HEADERS.notes, doc:'מסמך'};
  document.getElementById('theadRow').innerHTML = cols.map(k => '<th>' + colHeads[k] + '</th>').join('');
  document.getElementById('tbody').innerHTML = rows.map(r => {
    const evUrl = r.evKey ? EVIDENCE[r.evKey] : null;
    const docCell = evUrl ? '<a class="doc-yes" href="' + esc(evUrl) + '" target="_blank" rel="noopener" title="פתיחת מסמך הראיה">📄</a>' : '<span class="doc-no">אין מסמך</span>';
    return '<tr' + (evUrl ? ' class="has-doc" data-ev="' + esc(evUrl) + '"' : '') + '>' +
      '<td class="src">' + esc(SRC_LABEL[r.src] || r.src) + '</td>' +
      '<td class="num">' + esc(r.date) + '</td><td>' + esc(r.child) + '</td><td>' + esc(r.provider) + '</td><td>' + esc(r.receipt) + '</td>' +
      '<td class="num">' + esc(r.amount) + '</td><td><span class="chip" style="background:' + statusColor(r.status) + '">' + esc(r.status || 'ללא') + '</span></td>' +
      '<td class="num">' + esc(r.refund) + '</td><td class="num">' + esc(r.form) + '</td><td class="notes">' + esc(r.notes) + '</td>' +
      '<td>' + docCell + '</td></tr>';
  }).join('');
}
document.getElementById('tbody').addEventListener('click', function(e) {
  const tr = e.target.closest('tr.has-doc');
  if (!tr) return;
  if (e.target.closest('a')) return; // let the anchor handle itself
  const url = tr.getAttribute('data-ev');
  if (url) window.open(url, '_blank', 'noopener');
});
document.getElementById('fChild').addEventListener('change', renderTable);
document.getElementById('fStatus').addEventListener('change', renderTable);
document.getElementById('fSource').addEventListener('change', renderTable);
if (getSheetId()) { document.getElementById('dash').classList.remove('hidden'); loadData(true); }
else { changeSheet(); }
</script>
